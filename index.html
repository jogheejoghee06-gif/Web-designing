<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View From My Window</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room">

        <!-- Window -->
        <div class="window">

            <!-- Outside View -->
            <div class="sky">

                <div class="sun"></div>

                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>

                <!-- Mountains -->
                <div class="mountain mountain1"></div>
                <div class="mountain mountain2"></div>

                <!-- Trees -->
                <div class="tree tree1"></div>
                <div class="tree tree2"></div>
                <div class="tree tree3"></div>
                <div class="tree tree4"></div>

                <!-- Birds -->
                <div class="bird bird1">⌁</div>
                <div class="bird bird2">⌁</div>

                <!-- Window Text -->
                <div class="window-text">
                    <h1>View From My Window</h1>
                    <p>A little piece of the world outside.</p>
                </div>

            </div>

            <!-- Window Frame -->
            <div class="vertical-frame"></div>
            <div class="horizontal-frame"></div>

        </div>

        <!-- Curtains -->
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

        <!-- Windowsill -->
        <div class="windowsill">
            <div class="plant">
                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>
                <div class="pot"></div>
            </div>

            <div class="cup">☕</div>

            <div class="book">
                <span>MY DAY</span>
            </div>
        </div>

        <!-- Title -->
        <div class="corner-title">
            <span>MY LITTLE SPACE</span>
        </div>

    </div>

</body>
</html>
